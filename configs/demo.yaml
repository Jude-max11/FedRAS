seed: 7
output_dir: outputs/demo
experiment:
  rounds: 12
  clients: 24
  admission_cap: 6
  min_secagg: 3
  methods: [gcdp, greedy_repair, two_stage, fixed_aead, fixed_secagg]
  seeds: [7]
fl:
  backend: numpy
  model_megabits: 0.70
  classes: 4
  features: 12
  samples_per_client: 48
  dirichlet_alpha: 0.5
  local_epochs: 2
  batch_size: 24
  learning_rate: 0.12
link:
  deadline_ms: 850
  correlation: 0.82
  monte_carlo_samples: 32
  handover_penalty_ms: 110
  handover_loss_penalty: 0.10
  domains:
    ground: {share: 0.50, rate_mbps: 12.0, delay_ms: 35, loss: 0.02, handover: 0.03, outage: 0.00, cpu: 1.0, memory: 1.0, energy: 1.0}
    uav: {share: 0.25, rate_mbps: 7.0, delay_ms: 80, loss: 0.06, handover: 0.20, outage: 0.02, cpu: 0.8, memory: 0.8, energy: 0.75}
    satellite: {share: 0.25, rate_mbps: 3.0, delay_ms: 220, loss: 0.10, handover: 0.08, outage: 0.15, cpu: 0.7, memory: 0.7, energy: 0.8}
utility:
  alpha_bytes: 0.10
  beta_energy: 0.08
  gamma_distortion: 0.12
  delta_exposure: 0.10
  reliability_threshold: 0.18
  initial_budget: 8.0
  exposure_cost: {aead: 1.0, secagg: 0.28, noise: 0.12}
policies:
  - {name: q1, pruning: 0.0, bits: 32, aead: true, secagg: false, noise: 0.0}
  - {name: q2, pruning: 0.3, bits: 16, aead: true, secagg: false, noise: 0.0}
  - {name: q3, pruning: 0.5, bits: 8, aead: true, secagg: false, noise: 0.0}
  - {name: q4, pruning: 0.5, bits: 8, aead: true, secagg: true, noise: 0.0}
  - {name: q5, pruning: 0.7, bits: 8, aead: true, secagg: true, noise: 0.08}
