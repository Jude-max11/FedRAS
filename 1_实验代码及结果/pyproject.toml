[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mprbps-experiments"
version = "0.1.0"
description = "Reproducible experiments for mobility-prior risk-budgeted protection selection"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
full = ["torch>=2.2", "torchvision>=0.17", "tqdm>=4.66"]
dev = ["pytest>=8.0"]

[project.scripts]
mprbps = "mprbps.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

